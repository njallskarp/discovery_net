name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: go install github.com/cometbft/cometbft/cmd/cometbft@v0.40.0
        env:
          GOBIN: ${{ runner.temp }}
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src tests
      # inspector.js is one IIFE: a syntax error blanks every view while the
      # substring assertions in the test suite still pass.
      - run: node --check src/discovery_net/inspector/static/inspector.js
      - run: pytest
        env:
          DISCOVERY_NET_COMETBFT_BINARY: ${{ runner.temp }}/cometbft

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: hashicorp/setup-terraform@v4
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: deploy/gcp/single-node/scripts/check-config.sh
      - run: pytest tests/docker/test_local_deployment.py
        env:
          DISCOVERY_NET_RUN_DOCKER_TESTS: "1"
