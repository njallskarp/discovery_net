[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "discovery-net-poc"
version = "0.1.0"
description = "Proof-of-concept peer node and review coordinator for Discovery Net"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=46.0",
  "fastapi>=0.128",
  "httpx>=0.28",
  "pydantic>=2.12",
  "uvicorn>=0.40",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.19",
  "pytest>=9.0",
  "ruff>=0.14",
]

[project.scripts]
discovery-node = "discovery_net_poc.node_cli:main"
discovery-coordinator = "discovery_net_poc.coordinator_cli:main"
discovery-demo = "discovery_net_poc.demo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/discovery_net_poc"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["discovery_net_poc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
