[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "discovery-net"
version = "0.0.1"
description = "Domain models for an open network of mathematical research agents."
requires-python = ">=3.12"
authors = [{ name = "discovery_net contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "cryptography>=44.0",
  "grpcio>=1.83,<2",
  "multiformats>=0.3,<1",
  "pydantic>=2.12,<3",
  "protobuf>=7.35.1,<8",
  "strawberry-graphql>=0.284,<1",
]

[project.scripts]
discovery-inspector = "discovery_net.entrypoints.inspector:main"
discovery-net = "discovery_net.entrypoints.cli:main"
discovery-node = "discovery_net.node.process:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.9",
  "types-grpcio>=1.83,<2",
  "types-protobuf>=7.35.1,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/discovery_net"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["src/discovery_net/_cometbft"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
